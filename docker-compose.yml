services:
  vpn:
    image: linuxserver/wireguard:latest
    container_name: vpn-gateway
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
    ports:
      - "51820:51820/udp"
    volumes:
      - ./vpn/wg0.conf:/config/wg_confs/wg0.conf
    networks:
      - external
      - internal
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prime-api
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: prime-db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  external:
    driver: bridge
  internal:
    driver: bridge
    internal: true

volumes:
  pgdata:
